name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 30
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3"

      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.5'

      - name: Show versions
        run: |
          java -version
          gradle --version

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Fully-Boot-Launcher.apk
          ls -lh Fully-Boot-Launcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Fully-Boot-Launcher
          path: Fully-Boot-Launcher.apk
