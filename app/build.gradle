plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fully.bootlauncher'
    compileSdk 30

    defaultConfig {
        applicationId 'com.fully.bootlauncher'
        minSdk 23
        targetSdk 30
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
